# Cloudflare Builds root: apps/worker (include path: apps/worker/**).
name = "generator-rebus"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
# These are overridden by secrets in production
# SUPABASE_URL = ""
# SUPABASE_PUBLISHABLE_KEY = ""
# Enable only after catalog_recovery reports rollout_ready=true.
# CATALOG_QUALITY_FILTER = "true"
# CATALOG_MIN_PASS_RATE = "0.5"
# CATALOG_MIN_REBUS_SCORE = "5"

[secrets]
required = [ "SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY" ]
